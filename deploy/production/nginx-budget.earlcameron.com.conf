server {
    listen 80;
    listen [::]:80;
    server_name budget.earlcameron.com;

    location / {
        return 301 https://budget.earlcameron.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name budget.earlcameron.com;

    ssl_certificate /etc/letsencrypt/live/budget.earlcameron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.earlcameron.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 40m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /grpc {
        proxy_pass http://127.0.0.1:8105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location = /livez {
        proxy_pass http://127.0.0.1:8105;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8105;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8105;
        access_log off;
    }

    # Deploy hook. The release workflow POSTs here after publishing an image;
    # the webhook daemon on 9309 authenticates the shared-secret header and runs
    # the autoupdate script. An EXACT match (= /internal/deploy-hook) so nothing
    # else under /internal/ is exposed by accident.
    #
    # The request carries no tag and no command — the box decides what to deploy
    # — so the worst a leaked secret buys is an unnecessary re-check.
    location = /internal/deploy-hook {
        proxy_pass http://127.0.0.1:9309/hooks/cashflux-deploy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The hook waits for the deploy (pull + restart + health gate), which can
        # legitimately take minutes on a 2 GB droplet.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        access_log /var/log/nginx/cashflux-deploy-hook.log;
    }
}
