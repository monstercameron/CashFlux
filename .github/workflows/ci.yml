name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Security scan
        # Exclude e2e/: it's test tooling (a localhost static server), not production
        # code, so its file-serving path handling isn't a production risk.
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -severity high -confidence medium -exclude-dir=e2e ./...

      - name: Secrets scan
        run: go run github.com/zricethezav/gitleaks/v8@latest detect --no-git --source . --config .gitleaks.toml --redact --verbose

      - name: API compatibility guard
        run: go run ./cmd/api_compat_guard

      - name: Proto drift check
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.57.2 generate
          git diff --exit-code -- buf.yaml buf.gen.yaml proto internal/backendrpc/pb

      - name: Test (pure logic packages — js/wasm view packages are build-tagged out)
        run: go test ./...

      - name: Build server
        run: go build ./cmd/cashflux-server

      - name: Build WebAssembly
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /dev/null .

      - name: Build console SPAs (operator console + customer portal)
        # These are served by cashflux-server from web/admin and web/portal. Their
        # .wasm is git-ignored and built at release time (deploy/release-server.sh),
        # so verify both compile here or a broken console ships silently.
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build -o /dev/null ./cmd/cashflux-admin
          go build -o /dev/null ./cmd/cashflux-portal

  e2e:
    name: E2E deploy gate (@prod) ${{ matrix.shard }}/2
    # Runs on Windows so the committed coverage/a11y/-win32 visual baselines match
    # the runner's rendering. globalSetup builds the wasm; Playwright serves it and
    # drives Chromium. Visual pixel-diffs are a local gate (skipped in CI).
    runs-on: windows-latest
    # This is the DEPLOY GATE, and it runs the @prod subset — not the whole suite.
    #
    # The droplet's deploy hook fires when this workflow SUCCEEDS on main
    # (deploy/production/README.md). A gate that cannot finish therefore does not
    # fail loudly, it silently stops shipping: the full 312-test suite outgrew a
    # 30-minute ceiling, then outgrew the 60-minute one it was raised to, and each
    # run concluded "cancelled". Every push still looked like it went out while
    # budget.earlcameron.com sat on an old build for days.
    #
    # Splitting the job in two fixes the incentive rather than buying time again.
    # The gate answers one question — is it safe to ship? — with the smallest set
    # that can answer it: the app boots and every route renders, the cross-cutting
    # invariants hold, and the behaviour changed most recently still works. The
    # exhaustive suite moves to e2e-full.yml, which runs nightly and on demand and
    # is free to be slow, and free to stay red on a known issue without holding
    # releases hostage.
    #
    # Sharded two ways because playwright.config.mjs pins CI to ONE worker for a
    # real reason (a clean Windows runner cannot boot two ~80 MB wasm instances
    # without both starving the readiness gate), so parallelism has to come from
    # separate runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium

      # Middle layer of the pyramid: fast wasm component/registry tests via
      # GoWebComponents testkit (mock DOM, no browser). These never run under
      # `go test ./...` (js&&wasm build tag), so they get a dedicated lane here.
      # One shard runs this: it is the same work every time, so running it four
      # times would just spend three runners re-proving the same thing.
      - name: WASM component tests (testkit)
        if: matrix.shard == 1
        run: pwsh tools/wasm-test.ps1

      - name: Run deploy gate (shard ${{ matrix.shard }} of 2)
        working-directory: e2e
        run: npx playwright test --project=prod --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per shard: artifact names collide otherwise and the upload fails,
          # which would turn a real test failure into a confusing upload error.
          name: playwright-report-shard-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7
