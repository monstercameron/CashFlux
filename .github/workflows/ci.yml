name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Security scan
        # Exclude e2e/: it's test tooling (a localhost static server), not production
        # code, so its file-serving path handling isn't a production risk.
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -severity high -confidence medium -exclude-dir=e2e ./...

      - name: Secrets scan
        run: go run github.com/zricethezav/gitleaks/v8@latest detect --no-git --source . --config .gitleaks.toml --redact --verbose

      - name: API compatibility guard
        run: go run ./cmd/api_compat_guard

      - name: Proto drift check
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.57.2 generate
          git diff --exit-code -- buf.yaml buf.gen.yaml proto internal/backendrpc/pb

      - name: Test (pure logic packages — js/wasm view packages are build-tagged out)
        run: go test ./...

      - name: Build server
        run: go build ./cmd/cashflux-server

      - name: Build WebAssembly
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /dev/null .

      - name: Build console SPAs (operator console + customer portal)
        # These are served by cashflux-server from web/admin and web/portal. Their
        # .wasm is git-ignored and built at release time (deploy/release-server.sh),
        # so verify both compile here or a broken console ships silently.
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build -o /dev/null ./cmd/cashflux-admin
          go build -o /dev/null ./cmd/cashflux-portal

  e2e:
    name: E2E regression (Playwright) ${{ matrix.shard }}/4
    # Runs on Windows so the committed coverage/a11y/-win32 visual baselines match
    # the runner's rendering. globalSetup builds the wasm; Playwright serves it and
    # drives Chromium. Visual pixel-diffs are a local gate (skipped in CI).
    runs-on: windows-latest
    # SHARDED, because this lane was not merely slow — it was silently breaking
    # production deploys.
    #
    # The suite is 312 tests across 38 files, and playwright.config.mjs pins CI to
    # ONE worker (a clean Windows runner cannot boot two ~80 MB wasm app instances
    # without both starving the readiness gate) with 2 retries. Raising the ceiling
    # from 30 to 60 minutes bought time once; the suite grew past that too, and the
    # run then concluded "cancelled" rather than "failure".
    #
    # That is the part that mattered. The deploy hook on the droplet fires on the
    # `CI` workflow SUCCEEDING on main (deploy/production/README.md), so a lane
    # that never finishes means production silently stops updating while every
    # push still looks like it went out. budget.earlcameron.com sat on 1.6.1
    # through a whole release train for exactly this reason.
    #
    # Sharding keeps the single-worker constraint that the runner actually
    # requires and buys parallelism from separate runners instead, so each shard
    # finishes well inside its budget and the workflow can reach "success".
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium

      # Middle layer of the pyramid: fast wasm component/registry tests via
      # GoWebComponents testkit (mock DOM, no browser). These never run under
      # `go test ./...` (js&&wasm build tag), so they get a dedicated lane here.
      # One shard runs this: it is the same work every time, so running it four
      # times would just spend three runners re-proving the same thing.
      - name: WASM component tests (testkit)
        if: matrix.shard == 1
        run: pwsh tools/wasm-test.ps1

      - name: Run regression suite (shard ${{ matrix.shard }} of 4)
        working-directory: e2e
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per shard: artifact names collide otherwise and the upload fails,
          # which would turn a real test failure into a confusing upload error.
          name: playwright-report-shard-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7
